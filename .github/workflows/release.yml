name: Release

on:
  workflow_run:
    workflows: ["Ruff, Test"]
    types: [completed]
    branches: [master]

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/master' }}

    runs-on: ubuntu-latest
    concurrency: release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "./uv.lock"
      - name: Run Python Semantic Release
        id: release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(git rev-parse HEAD)
          uvx --from python-semantic-release semantic-release version
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "tag=$(git tag --points-at HEAD | head -n 1)" >> "$GITHUB_OUTPUT"
          fi

  # A release made with GITHUB_TOKEN does not fire publish.yml's `release`
  # trigger, so the new tag is published from here.
  publish:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
