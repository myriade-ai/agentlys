[project]
name = "agentlys"
version = "1.21.1"
description = "Lightweight AI agent library. Turn Python functions/classes into AI tools instantly."
authors = [
    {name = "Benjamin Derville", email = "benderville@gmail.com"}
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=12.1.1",
    "pydantic==2.13.5",
]

[project.urls]
Repository = "https://github.com/myriade-ai/agentlys"
Changelog = "https://github.com/myriade-ai/agentlys/blob/master/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic>=0.46.0"]
openai = ["openai>=1.63.2"]
mcp = [
    "mcp>=1.10.0",
]
all = [
    "anthropic>=0.46.0",
    "openai>=1.63.2",
    "mcp>=1.10.0",
]
build = [
    "uv>=0.9.5,<0.14.0",
]

[tool.semantic_release]
version_source = "commit"
version_toml = [
    "pyproject.toml:project.version",
]
branch = "master"
upload_to_pypi = false
upload_to_release = true
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""
changelog_file = "CHANGELOG.md"
dist_path = "dist/"
commit_message = "chore(release): bump version to {version}"

# Push through the checkout's deploy key (allowed past the master ruleset);
# GH_TOKEN still creates the GitHub release.
[tool.semantic_release.remote]
ignore_token_for_push = true


[tool.uv.sources]
agentlys = { workspace = true }

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "anthropic>=0.46.0",
    "openai>=1.63.2",
    "pytest-asyncio>=0.26.0",
    "vcrpy>=8.2.1",
    "pytest-recording>=0.13.2",
    "pytest>=9.0.3",
    # Pinned: a ruff minor release changes the default rule set, so a floating
    # spec silently turns `uv run ruff check` red on every open branch.  Keep in
    # sync with the version the ruff job installs in .github/workflows/test.yml.
    "ruff==0.15.17",
    "mcp>=1.10.0",
    "pre-commit>=4.2.0",
    "build>=1.2.2.post1",
    "twine>=6.1.0",
]
